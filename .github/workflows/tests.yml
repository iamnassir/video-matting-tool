name: tests

# Installs the tool on clean machines the way the documentation describes and runs the test suite
# there.  No graphics card is available on these machines, so everything runs on the processor;
# tests that need a GPU, optional model packages or the real test footage skip themselves.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows, install.bat, Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Setup the way a user does it (install.bat)
        shell: cmd
        env:
          VMT_PYTHON: python
        run: call install.bat --no-pause --accept-rvm-license
      - name: Test dependencies
        shell: cmd
        run: .venv\Scripts\python.exe -m pip install -r requirements-dev.txt -c constraints.txt --no-cache-dir
      - name: Tests
        shell: cmd
        run: .venv\Scripts\python.exe -m pytest -q
      - name: A complete run with the default model on the processor
        shell: cmd
        run: |
          ffmpeg -v error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440 -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac clip.mp4
          .venv\Scripts\python.exe main.py process -i clip.mp4 -o clip_green.mp4 --model rvm --device cpu
          if %errorlevel%==1 exit /b 1
          if not exist clip_green.mp4 exit /b 1
          .venv\Scripts\python.exe main.py probe clip_green.mp4

  linux:
    name: Linux, manual install, Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: FFmpeg (current static build)
        run: |
          curl -fsSL -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p "$HOME/ffmpeg"
          tar -xJf ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=1
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Install as in docs/INSTALL.md (CPU)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python -m pip install -r requirements.txt -c constraints.txt
          .venv/bin/python -m pip install -r requirements-dev.txt -c constraints.txt
          .venv/bin/python main.py models download rvm --all --accept-license
          .venv/bin/python main.py system
      - name: Tests
        run: .venv/bin/python -m pytest -q
      - name: A complete run with the default model on the processor
        run: |
          ffmpeg -v error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440 -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac clip.mp4
          code=0
          .venv/bin/python main.py process -i clip.mp4 -o clip_green.mp4 --model rvm --device cpu || code=$?
          if [ "$code" = "1" ]; then exit 1; fi
          test -f clip_green.mp4
          .venv/bin/python main.py probe clip_green.mp4
